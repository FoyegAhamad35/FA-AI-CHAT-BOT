<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FA AI Workspace - Chat Bot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1 class="logo">FA AI</h1>
        <button class="btn-new-chat" id="newChatBtn">+ New Chat</button>
      </div>
      
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search conversations...">
      </div>

      <div class="chat-history" id="chatHistory">
        <div class="empty-state">No chats yet</div>
      </div>

      <div class="sidebar-footer">
        <button class="btn-icon" title="Settings">⚙️</button>
        <button class="btn-icon" title="Theme">🌙</button>
        <button class="btn-icon" title="About">ℹ️</button>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-container">
      <div class="chat-header">
        <h2 id="chatTitle">FA AI Workspace</h2>
        <button class="btn-icon" id="menuBtn">☰</button>
      </div>

      <div class="messages" id="messagesContainer">
        <div class="welcome-screen">
          <div class="welcome-content">
            <div class="welcome-logo">🤖</div>
            <h2>Welcome to FA AI Workspace</h2>
            <p>Start a conversation by typing a message below</p>
          </div>
        </div>
      </div>

      <!-- Message Input -->
      <div class="input-area">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="messageInput" 
            placeholder="Type your message..."
            autocomplete="off"
          >
          <button class="btn-send" id="sendBtn">➤</button>
        </div>
        <div class="input-hint">Press Enter to send</div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
