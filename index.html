<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FA AI Chat Bot</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
html,body{height:100%;overflow:hidden;background:#0f172a;color:#e5e7eb}
.app{display:flex;height:100dvh;width:100%;background:linear-gradient(135deg,#0f172a,#111827,#020617)}
.sidebar{width:300px;background:rgba(15,23,42,.94);border-right:1px solid rgba(148,163,184,.18);display:flex;flex-direction:column;padding:14px;gap:12px}
.brand{font-size:18px;font-weight:900;color:#93c5fd;padding:8px 4px;text-shadow:0 0 18px #2563eb}
.new-chat{border:0;background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;padding:13px;border-radius:16px;font-weight:900;text-align:left}
.search-box{width:100%;border:1px solid rgba(148,163,184,.18);background:#020617;color:#e5e7eb;padding:11px;border-radius:13px;outline:none}
.chat-tools{display:flex;gap:8px}
.tool-btn{flex:1;border:1px solid rgba(148,163,184,.18);background:rgba(30,41,59,.75);color:#e5e7eb;padding:10px;border-radius:12px;font-weight:800}
.chat-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
.chat-item{padding:11px;border-radius:13px;cursor:pointer;color:#cbd5e1;display:flex;justify-content:space-between;border:1px solid transparent}
.chat-item.active{background:rgba(37,99,235,.18);border-color:rgba(96,165,250,.35);color:#93c5fd;font-weight:900}
.delete-btn{border:0;background:transparent;color:#fb7185;font-size:17px}
.side-bottom{border-top:1px solid rgba(148,163,184,.18);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.side-action{border:0;background:transparent;color:#cbd5e1;padding:10px;text-align:left;border-radius:10px;font-weight:800}

.main{flex:1;display:flex;flex-direction:column;height:100dvh}
.topbar{height:62px;border-bottom:1px solid rgba(148,163,184,.16);display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(15,23,42,.75)}
.menu-btn{display:none;border:0;background:rgba(30,41,59,.9);color:white;border-radius:12px;padding:10px 14px;font-size:22px}
.top-title{font-weight:900;color:#f8fafc}
.model-badge{font-size:12px;color:#93c5fd;background:rgba(37,99,235,.18);padding:7px 10px;border-radius:999px}

.chat-area{flex:1;overflow-y:auto;padding:24px 14px 150px;scroll-behavior:smooth}
.welcome{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#94a3b8;gap:12px}
.logo{width:72px;height:72px;border-radius:24px;background:linear-gradient(135deg,#38bdf8,#8b5cf6,#ec4899);box-shadow:0 0 45px #7c3aed99}
.welcome h1{font-size:34px;background:linear-gradient(135deg,#60a5fa,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.message{max-width:900px;margin:0 auto 20px;display:flex;gap:12px;align-items:flex-start;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.message.user{flex-direction:row-reverse}
.avatar{width:38px;height:38px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.user .avatar{background:#2563eb;color:white}
.assistant .avatar{background:#7c3aed;color:white}
.bubble-wrap{max-width:86%}
.bubble{background:rgba(30,41,59,.88);border:1px solid rgba(148,163,184,.16);padding:15px 17px;border-radius:20px;line-height:1.7;box-shadow:0 12px 35px #0005;font-size:16px;overflow-wrap:anywhere;color:#e5e7eb}
.user .bubble{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:white}
.time{font-size:11px;color:#94a3b8;margin-top:5px}
.bubble p{margin-bottom:10px}
.bubble strong{font-weight:900;color:#f8fafc}
.bubble ul,.bubble ol{padding-left:22px;margin:8px 0}
.bubble code{background:#111827;color:#93c5fd;padding:2px 6px;border-radius:6px}
.bubble pre{background:#020617;color:#e5e7eb;padding:14px;border-radius:14px;overflow:auto;margin:12px 0;border:1px solid rgba(148,163,184,.18)}
.msg-actions{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}
.copy-btn,.regen-btn,.edit-btn,.speak-btn,.stop-speak-btn{border:0;background:rgba(37,99,235,.18);color:#93c5fd;padding:7px 11px;border-radius:11px;font-size:12px;font-weight:900}

.typing-loader{display:flex;gap:5px;align-items:center}
.typing-loader span{width:7px;height:7px;border-radius:50%;background:#a78bfa;animation:bounce 1s infinite}
.typing-loader span:nth-child(2){animation-delay:.15s}
.typing-loader span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:scale(.7);opacity:.5}40%{transform:scale(1.25);opacity:1}}

.composer-wrap{position:fixed;bottom:0;left:300px;right:0;background:rgba(15,23,42,.92);border-top:1px solid rgba(148,163,184,.16);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:20}
.composer{max-width:930px;margin:0 auto;display:flex;gap:8px;align-items:center;background:rgba(30,41,59,.9);border:1px solid rgba(148,163,184,.18);border-radius:22px;padding:8px}
#messageInput{flex:1;border:0;background:transparent;outline:0;font-size:16px;min-height:44px;color:#f8fafc;padding-left:8px}
.icon-btn,.send-btn,.stop-btn{border:0;width:48px;height:48px;border-radius:17px;color:#fff;font-size:20px;font-weight:900}
.icon-btn{background:rgba(37,99,235,.25)}
.mic-on{background:#ef4444!important}
.send-btn{background:linear-gradient(135deg,#2563eb,#8b5cf6)}
.stop-btn{display:none;background:#ef4444}
.note{text-align:center;color:#64748b;font-size:12px;margin-top:6px}

.modal-backdrop{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal-backdrop.active{display:flex}
.modal{width:100%;max-width:480px;background:#111827;border:1px solid rgba(148,163,184,.2);border-radius:24px;padding:22px}
.modal h2{margin-bottom:16px;font-size:28px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:900;margin-bottom:6px;color:#cbd5e1}
.field input,.field textarea,.field select{width:100%;border:1px solid rgba(148,163,184,.2);border-radius:14px;padding:13px;background:#020617;color:#e5e7eb;outline:0;font-size:14px}
.field textarea{height:95px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px}
.btn{border:0;padding:12px 17px;border-radius:14px;font-weight:900}
.btn-secondary{background:#334155;color:white}
.btn-primary{background:#2563eb;color:white}

.light{background:#f7f9fc;color:#111827}
.light .app{background:#f7f9fc}
.light .main,.light .topbar,.light .composer-wrap{background:#fff;color:#111827;border-color:#e5e7eb}
.light .sidebar{background:#eef3f9;border-color:#d9e2ef}
.light .bubble{background:#fff;color:#111827;border-color:#e5e7eb}
.light .composer{background:#f1f5f9}
.light #messageInput{color:#111827}
.light .chat-item{color:#374151}
.light .tool-btn{background:#fff;color:#374151}
.light .side-action{color:#374151}
.light .search-box{background:#fff;color:#111827}

@media(max-width:760px){
.sidebar{position:fixed;left:-310px;top:0;bottom:0;z-index:40;transition:left .25s}
.sidebar.open{left:0}
.menu-btn{display:block}
.composer-wrap{left:0}
.chat-area{padding:18px 10px 150px}
.bubble-wrap{max-width:88%}
.bubble{font-size:15px}
.model-badge{display:none}
}
</style>
</head>

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="brand">FA AI CHAT BOT</div>
<button class="new-chat" id="newChatBtn">+ New Chat</button>
<input class="search-box" id="searchInput" placeholder="Search chats..." />

<div class="chat-tools">
<button class="tool-btn" id="renameBtn">Rename</button>
<button class="tool-btn" id="clearBtn">Clear</button>
</div>

<div class="chat-tools">
<button class="tool-btn" id="exportBtn">Export TXT</button>
</div>

<div class="chat-tools">
<button class="tool-btn" id="backupBtn">Backup</button>
<button class="tool-btn" id="importBtn">Import</button>
</div>

<input type="file" id="importFile" accept="application/json" hidden />
<div class="chat-list" id="chatList"></div>

<div class="side-bottom">
<button class="side-action" id="settingsBtn">⚙️ Settings</button>
<button class="side-action" id="themeBtn">☀️ Light / Dark</button>
<button class="side-action" id="voiceToggleBtn">🔊 Auto Voice: OFF</button>
<button class="side-action" id="stopVoiceBtn">🔇 Stop Voice</button>
</div>
</aside>

<main class="main">
<header class="topbar">
<button class="menu-btn" id="menuBtn">☰</button>
<div class="top-title">Universal AI Interface</div>
<div class="model-badge" id="modelBadge">Model</div>
</header>

<section class="chat-area" id="chatArea"></section>

<div class="composer-wrap">
<div class="composer">
<button class="icon-btn" id="micBtn">🎤</button>
<input id="messageInput" type="text" placeholder="Ask anything..." />
<button class="icon-btn" id="readLastBtn">🔊</button>
<button class="send-btn" id="sendBtn">➤</button>
<button class="stop-btn" id="stopBtn">■</button>
</div>
<div class="note">AI can make mistakes. Check important info.</div>
</div>
</main>
</div>

<div class="modal-backdrop" id="settingsModal">
<div class="modal">
<h2>⚙️ Settings</h2>

<div class="field">
<label>OpenRouter API Key</label>
<input id="apiKeyInput" type="password" placeholder="sk-or-..." />
</div>

<div class="field">
<label>Model ID</label>
<input id="modelInput" value="deepseek/deepseek-r1:free" />
</div>

<div class="field">
<label>System Prompt</label>
<textarea id="systemPromptInput">You are a helpful AI assistant.</textarea>
</div>

<div class="field">
<label>Voice Language</label>
<select id="voiceLangInput">
<option value="bn-BD">Bengali</option>
<option value="en-US">English</option>
<option value="hi-IN">Hindi</option>
</select>
</div>

<div class="field">
<label>Voice Speed</label>
<input id="voiceRateInput" type="number" min="0.5" max="1.5" step="0.1" value="1" />
</div>

<div class="modal-actions">
<button class="btn btn-secondary" id="closeSettingsBtn">Cancel</button>
<button class="btn btn-primary" id="saveSettingsBtn">Save</button>
</div>
</div>
</div>

<script>
const STORAGE_CHATS="fa_ai_chats_phase9";
const STORAGE_SETTINGS="fa_ai_settings_phase9";
const STORAGE_THEME="fa_ai_theme_phase9";
const STORAGE_AUTO_VOICE="fa_ai_auto_voice_phase9";

const chatArea=document.getElementById("chatArea");
const chatList=document.getElementById("chatList");
const messageInput=document.getElementById("messageInput");
const sendBtn=document.getElementById("sendBtn");
const stopBtn=document.getElementById("stopBtn");
const micBtn=document.getElementById("micBtn");
const readLastBtn=document.getElementById("readLastBtn");
const newChatBtn=document.getElementById("newChatBtn");
const settingsBtn=document.getElementById("settingsBtn");
const themeBtn=document.getElementById("themeBtn");
const voiceToggleBtn=document.getElementById("voiceToggleBtn");
const stopVoiceBtn=document.getElementById("stopVoiceBtn");
const menuBtn=document.getElementById("menuBtn");
const sidebar=document.getElementById("sidebar");
const settingsModal=document.getElementById("settingsModal");
const apiKeyInput=document.getElementById("apiKeyInput");
const modelInput=document.getElementById("modelInput");
const systemPromptInput=document.getElementById("systemPromptInput");
const voiceLangInput=document.getElementById("voiceLangInput");
const voiceRateInput=document.getElementById("voiceRateInput");
const closeSettingsBtn=document.getElementById("closeSettingsBtn");
const saveSettingsBtn=document.getElementById("saveSettingsBtn");
const renameBtn=document.getElementById("renameBtn");
const clearBtn=document.getElementById("clearBtn");
const exportBtn=document.getElementById("exportBtn");
const backupBtn=document.getElementById("backupBtn");
const importBtn=document.getElementById("importBtn");
const importFile=document.getElementById("importFile");
const searchInput=document.getElementById("searchInput");
const modelBadge=document.getElementById("modelBadge");

let chats=[];
let currentChatId=null;
let isLoading=false;
let stopTyping=false;
let recognition=null;
let isListening=false;
let autoVoice=localStorage.getItem(STORAGE_AUTO_VOICE)==="1";

function uid(){return Date.now().toString()+Math.random().toString(16).slice(2)}
function nowTime(){return new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})}
function saveChats(){localStorage.setItem(STORAGE_CHATS,JSON.stringify(chats))}
function getCurrentChat(){return chats.find(c=>c.id===currentChatId)}
function scrollBottom(){setTimeout(()=>chatArea.scrollTop=chatArea.scrollHeight,40)}

function escapeHtml(text){
return String(text).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}

function markdownToHtml(text){
let safe=escapeHtml(text);
safe=safe.replace(/```([\s\S]*?)```/g,(_,code)=>"<pre><code>"+code.trim()+"</code></pre>");
safe=safe.replace(/^### (.*)$/gm,"<h3>$1</h3>");
safe=safe.replace(/^## (.*)$/gm,"<h2>$1</h2>");
safe=safe.replace(/^# (.*)$/gm,"<h1>$1</h1>");
safe=safe.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
safe=safe.replace(/\*(.*?)\*/g,"<em>$1</em>");
safe=safe.replace(/`([^`]+)`/g,"<code>$1</code>");
safe=safe.replace(/^- (.*)$/gm,"<li>$1</li>");
safe=safe.replace(/(<li>[\s\S]*?<\/li>)/g,"<ul>$1</ul>");
safe=safe.replace(/<\/ul>\s*<ul>/g,"");
safe=safe.split(/\n\s*\n/).map(block=>{
if(block.includes("<pre>")||block.includes("<ul>")||block.includes("<h1>")||block.includes("<h2>")||block.includes("<h3>")) return block;
return "<p>"+block.replace(/\n/g,"<br>")+"</p>";
}).join("");
return safe;
}

function loadSettings(){
const saved=localStorage.getItem(STORAGE_SETTINGS);
const s=saved?JSON.parse(saved):{
apiKey:"",
model:"deepseek/deepseek-r1:free",
systemPrompt:"You are a helpful AI assistant.",
voiceLang:"bn-BD",
voiceRate:1
};
apiKeyInput.value=s.apiKey||"";
modelInput.value=s.model||"deepseek/deepseek-r1:free";
systemPromptInput.value=s.systemPrompt||"You are a helpful AI assistant.";
voiceLangInput.value=s.voiceLang||"bn-BD";
voiceRateInput.value=s.voiceRate||1;
modelBadge.textContent=(s.model||"Model").split("/").pop();
return s;
}

function saveSettings(){
localStorage.setItem(STORAGE_SETTINGS,JSON.stringify({
apiKey:apiKeyInput.value.trim(),
model:modelInput.value.trim()||"deepseek/deepseek-r1:free",
systemPrompt:systemPromptInput.value.trim()||"You are a helpful AI assistant.",
voiceLang:voiceLangInput.value,
voiceRate:Number(voiceRateInput.value)||1
}));
settingsModal.classList.remove("active");
loadSettings();
alert("Settings saved.");
}

function createNewChat(){
const chat={id:uid(),title:"New Chat",messages:[],createdAt:new Date().toISOString()};
chats.unshift(chat);
currentChatId=chat.id;
saveChats();
renderAll();
sidebar.classList.remove("open");
}

function loadChats(){
const saved=localStorage.getItem(STORAGE_CHATS);
chats=saved?JSON.parse(saved):[];
if(!chats.length)createNewChat();
else{currentChatId=chats[0].id;renderAll()}
}

function makeTitle(t){
t=t.trim().replace(/\s+/g," ");
return t.length>30?t.slice(0,30)+"...":t||"New Chat";
}

function renderChatList(){
chatList.innerHTML="";
const q=searchInput.value.toLowerCase().trim();
chats.filter(chat=>!q||chat.title.toLowerCase().includes(q)||chat.messages.some(m=>m.content.toLowerCase().includes(q))).forEach(chat=>{
const item=document.createElement("div");
item.className="chat-item"+(chat.id===currentChatId?" active":"");
item.onclick=()=>{currentChatId=chat.id;renderAll();sidebar.classList.remove("open")};
item.innerHTML=`<span>${escapeHtml(chat.title)}</span><button class="delete-btn">×</button>`;
item.querySelector("button").onclick=e=>{
e.stopPropagation();
if(confirm("Delete this chat?")){
chats=chats.filter(c=>c.id!==chat.id);
if(!chats.length){createNewChat();return}
currentChatId=chats[0].id;
saveChats();
renderAll();
}
};
chatList.appendChild(item);
});
}

function renderMessages(){
const chat=getCurrentChat();
chatArea.innerHTML="";
if(!chat||!chat.messages.length){
chatArea.innerHTML=`<div class="welcome"><div class="logo"></div><h1>Hello, User</h1><p>How can I help you today?</p></div>`;
return;
}
chat.messages.forEach((m,i)=>{
const box=document.createElement("div");
box.className="message "+m.role;
let content=m.content==="__LOADING__"?`<div class="typing-loader"><span></span><span></span><span></span></div>`:(m.role==="assistant"?markdownToHtml(m.content):escapeHtml(m.content));
const userEdit=m.role==="user"?`<button class="edit-btn" data-edit="${i}">✎ Edit</button>`:"";
const actions=m.content!=="__LOADING__"?`
<div class="msg-actions">
${m.role==="assistant"?`<button class="copy-btn" data-copy="${i}">📋 Copy</button><button class="speak-btn" data-speak="${i}">🔊 Speak</button><button class="stop-speak-btn">🔇 Stop</button><button class="regen-btn" data-regen="${i}">↻ Regenerate</button>`:""}
${userEdit}
</div>`:"";
box.innerHTML=`
<div class="avatar">${m.role==="user"?"U":"AI"}</div>
<div class="bubble-wrap">
<div class="bubble">${content}</div>
<div class="time">${m.time||""}</div>
${actions}
</div>`;
chatArea.appendChild(box);
});
document.querySelectorAll(".copy-btn").forEach(btn=>btn.onclick=()=>navigator.clipboard.writeText(chat.messages[btn.dataset.copy].content));
document.querySelectorAll(".regen-btn").forEach(btn=>btn.onclick=()=>regenerateResponse(Number(btn.dataset.regen)));
document.querySelectorAll(".edit-btn").forEach(btn=>btn.onclick=()=>editUserMessage(Number(btn.dataset.edit)));
document.querySelectorAll(".speak-btn").forEach(btn=>btn.onclick=()=>speakText(chat.messages[btn.dataset.speak].content));
document.querySelectorAll(".stop-speak-btn").forEach(btn=>btn.onclick=()=>speechSynthesis.cancel());
scrollBottom();
}

function renderAll(){renderChatList();renderMessages()}

function addMessage(role,content){
const chat=getCurrentChat();
chat.messages.push({role,content,time:nowTime()});
if(role==="user"&&chat.title==="New Chat")chat.title=makeTitle(content);
saveChats();
renderAll();
}

async function typeAssistantText(text){
const chat=getCurrentChat();
let msg=chat.messages[chat.messages.length-1];
msg.content="";
saveChats();
renderMessages();
for(let i=0;i<text.length;i++){
if(stopTyping){msg.content+="\n\n[Stopped]";break}
msg.content+=text[i];
if(i%3===0){saveChats();renderMessages()}
await new Promise(r=>setTimeout(r,7));
}
saveChats();
renderMessages();
if(autoVoice && !stopTyping)speakText(text);
}

function setLoadingUI(state){
isLoading=state;
sendBtn.style.display=state?"none":"block";
stopBtn.style.display=state?"block":"none";
}

async function sendMessage(){
const text=messageInput.value.trim();
if(!text||isLoading)return;
const settings=loadSettings();
if(!settings.apiKey){
settingsModal.classList.add("active");
alert("Please add your OpenRouter API key first.");
return;
}
addMessage("user",text);
messageInput.value="";
stopTyping=false;
setLoadingUI(true);
addMessage("assistant","__LOADING__");
try{
const reply=await callOpenRouter(settings);
await typeAssistantText(reply);
}catch(e){
const chat=getCurrentChat();
chat.messages[chat.messages.length-1].content="Error: "+e.message;
saveChats();
renderAll();
}finally{setLoadingUI(false)}
}

async function regenerateResponse(index){
if(isLoading)return;
const chat=getCurrentChat();
let userIndex=-1;
for(let i=index-1;i>=0;i--){if(chat.messages[i].role==="user"){userIndex=i;break}}
if(userIndex===-1)return;
chat.messages=chat.messages.slice(0,userIndex+1);
saveChats();
renderAll();
stopTyping=false;
setLoadingUI(true);
addMessage("assistant","__LOADING__");
try{
const reply=await callOpenRouter(loadSettings());
await typeAssistantText(reply);
}catch(e){
chat.messages[chat.messages.length-1].content="Error: "+e.message;
saveChats();
renderAll();
}finally{setLoadingUI(false)}
}

function editUserMessage(index){
const chat=getCurrentChat();
const updated=prompt("Edit message:",chat.messages[index].content);
if(!updated||!updated.trim())return;
chat.messages[index].content=updated.trim();
chat.messages=chat.messages.slice(0,index+1);
saveChats();
renderAll();
regenerateResponse(index+1);
}

async function callOpenRouter(settings){
const chat=getCurrentChat();
const messages=[
{role:"system",content:settings.systemPrompt},
...chat.messages.filter(m=>m.content!=="__LOADING__").map(m=>({role:m.role,content:m.content}))
];
const res=await fetch("https://openrouter.ai/api/v1/chat/completions",{
method:"POST",
headers:{
"Authorization":"Bearer "+settings.apiKey,
"Content-Type":"application/json",
"HTTP-Referer":location.origin,
"X-OpenRouter-Title":"FA AI Chat Bot"
},
body:JSON.stringify({model:settings.model,messages,temperature:.7,max_tokens:1700})
});
const data=await res.json();
if(!res.ok)throw new Error(data.error?.message||"API request failed.");
return data.choices?.[0]?.message?.content||"No response received.";
}

function setupVoiceInput(){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){micBtn.onclick=()=>alert("Voice input not supported.");return}
recognition=new SR();
recognition.interimResults=true;
recognition.continuous=false;
recognition.onstart=()=>{isListening=true;micBtn.classList.add("mic-on");micBtn.textContent="🔴"};
recognition.onend=()=>{isListening=false;micBtn.classList.remove("mic-on");micBtn.textContent="🎤"};
recognition.onresult=e=>{
let text="";
for(let i=e.resultIndex;i<e.results.length;i++){text+=e.results[i][0].transcript}
messageInput.value=text;
};
micBtn.onclick=()=>{
recognition.lang=loadSettings().voiceLang||"bn-BD";
if(isListening){recognition.stop();return}
recognition.start();
};
}

function cleanSpeakText(text){
return text.replace(/```[\s\S]*?```/g," code block omitted ")
.replace(/[#*_`>-]/g," ")
.replace(/\s+/g," ")
.trim();
}

function speakText(text){
if(!("speechSynthesis" in window)){alert("Voice reply not supported.");return}
const settings=loadSettings();
speechSynthesis.cancel();
const utter=new SpeechSynthesisUtterance(cleanSpeakText(text));
utter.lang=settings.voiceLang||"bn-BD";
utter.rate=Number(settings.voiceRate)||1;
utter.pitch=1;
speechSynthesis.speak(utter);
}

function speakLastAssistant(){
const chat=getCurrentChat();
const last=[...chat.messages].reverse().find(m=>m.role==="assistant"&&m.content!=="__LOADING__");
if(last)speakText(last.content);
else alert("No AI reply to read.");
}

function renameCurrentChat(){
const chat=getCurrentChat();
const name=prompt("New chat name:",chat.title);
if(name&&name.trim()){chat.title=name.trim();saveChats();renderAll()}
}

function clearCurrentChat(){
const chat=getCurrentChat();
if(confirm("Clear current chat?")){
chat.messages=[];
chat.title="New Chat";
saveChats();
renderAll();
}
}

function downloadFile(name,content,type){
const blob=new Blob([content],{type});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download=name;
a.click();
URL.revokeObjectURL(url);
}

function exportCurrentChat(){
const chat=getCurrentChat();
let text="FA AI CHAT BOT EXPORT\n\nTitle: "+chat.title+"\nDate: "+new Date().toLocaleString()+"\n\n";
chat.messages.forEach(m=>{text+=m.role.toUpperCase()+" ["+(m.time||"")+"]:\n"+m.content+"\n\n"});
downloadFile((chat.title||"chat")+".txt",text,"text/plain");
}

function backupChats(){
downloadFile("fa-ai-chat-backup.json",JSON.stringify({version:"phase9",date:new Date().toISOString(),chats},null,2),"application/json");
}

function importChats(file){
const reader=new FileReader();
reader.onload=()=>{
try{
const data=JSON.parse(reader.result);
if(!data.chats||!Array.isArray(data.chats))throw new Error("Invalid backup file");
chats=data.chats;
currentChatId=chats[0]?.id||null;
if(!currentChatId){createNewChat();return}
saveChats();
renderAll();
alert("Chat backup imported.");
}catch(e){alert("Import failed: "+e.message)}
};
reader.readAsText(file);
}

function updateVoiceButton(){
voiceToggleBtn.textContent=autoVoice?"🔊 Auto Voice: ON":"🔊 Auto Voice: OFF";
}

sendBtn.onclick=sendMessage;
stopBtn.onclick=()=>{stopTyping=true;setLoadingUI(false)};
readLastBtn.onclick=speakLastAssistant;
stopVoiceBtn.onclick=()=>speechSynthesis.cancel();
voiceToggleBtn.onclick=()=>{
autoVoice=!autoVoice;
localStorage.setItem(STORAGE_AUTO_VOICE,autoVoice?"1":"0");
updateVoiceButton();
};
messageInput.onkeydown=e=>{if(e.key==="Enter")sendMessage()};
newChatBtn.onclick=createNewChat;
settingsBtn.onclick=()=>{loadSettings();settingsModal.classList.add("active")};
closeSettingsBtn.onclick=()=>settingsModal.classList.remove("active");
saveSettingsBtn.onclick=saveSettings;
renameBtn.onclick=renameCurrentChat;
clearBtn.onclick=clearCurrentChat;
exportBtn.onclick=exportCurrentChat;
backupBtn.onclick=backupChats;
importBtn.onclick=()=>importFile.click();
importFile.onchange=e=>{if(e.target.files[0])importChats(e.target.files[0])};
searchInput.oninput=renderChatList;
themeBtn.onclick=()=>{
document.body.classList.toggle("light");
localStorage.setItem(STORAGE_THEME,document.body.classList.contains("light")?"light":"dark");
};
menuBtn.onclick=()=>sidebar.classList.toggle("open");
settingsModal.onclick=e=>{if(e.target===settingsModal)settingsModal.classList.remove("active")};

if(localStorage.getItem(STORAGE_THEME)==="light")document.body.classList.add("light");
updateVoiceButton();
loadSettings();
loadChats();
setupVoiceInput();

if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("./sw.js").catch(err=>console.log(err));
});
}
</script>
</body>
</html>
