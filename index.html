<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="FA AI CHAT BOT - Mobile-first AI Chatbot">
    <title>FA AI CHAT BOT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
                <span class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </button>
            <h1 class="app-title">FA AI CHAT BOT</h1>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </div>
    </header>

    <!-- Drawer Menu -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <nav class="drawer-menu" id="drawerMenu">
        <div class="drawer-header">
            <h2>Menu</h2>
            <button class="drawer-close" id="drawerClose" aria-label="Close menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="drawer-body">
            <button class="drawer-item new-chat-btn" id="newChatBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"></path>
                </svg>
                <span>New Chat</span>
            </button>
            <button class="drawer-item clear-chat-btn" id="clearChatBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
                <span>Clear Chat</span>
            </button>
            <div class="drawer-divider"></div>
            <div class="language-selector">
                <label>Language</label>
                <div class="language-buttons">
                    <button class="lang-btn active" data-lang="en">English</button>
                    <button class="lang-btn" data-lang="bn">বাংলা</button>
                </div>
            </div>
            <div class="drawer-divider"></div>
            <div class="drawer-footer">
                <p class="version">Version 1.0</p>
                <p class="credits">Phase 1 - UI Ready</p>
            </div>
        </div>
    </nav>

    <!-- Main Chat Container -->
    <main class="chat-container">
        <div class="messages-area" id="messagesArea">
            <div class="welcome-message">
                <h2 id="welcomeTitle">Welcome to FA AI CHAT BOT</h2>
                <p id="welcomeText">Start a conversation to begin</p>
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <div class="input-container">
        <div class="input-wrapper">
            <input 
                type="text" 
                class="message-input" 
                id="messageInput" 
                placeholder="Type your message..." 
                autocomplete="off"
            >
            <button class="send-button" id="sendButton" aria-label="Send message">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.41,22.99 3.50612381,23.1 4.13399899,22.99 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.9702544,11.6889879 L4.13399899,1.16346272 C3.34915502,0.9 2.40734225,1.00636533 1.77946707,1.4776575 C0.994623095,2.10604706 0.837654326,3.0486314 1.15159189,3.99751086 L3.03521743,10.4385039 C3.03521743,10.5956013 3.19218622,10.7526988 3.50612381,10.7526988 L16.6915026,11.5381856 C16.6915026,11.5381856 17.1624089,11.5381856 17.1624089,12.0094777 C17.1624089,12.4807698 16.6915026,12.4744748 16.6915026,12.4744748 Z"></path>
                </svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
